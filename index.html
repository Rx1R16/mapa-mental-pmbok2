 function zoomAt(clientX,clientY,f){const r=stage.getBoundingClientRect(),x=clientX-r.left,y=clientY-r.top,wx=(x-tx)/scale,wy=(y-ty)/scale;scale=Math.max(.04,Math.min(5,scale*f));tx=x-wx*scale;ty=y-wy*scale;apply()}
 stage.addEventListener('pointerdown',e=>{isPan=true;stage.classList.add('dragging');sx=e.clientX;sy=e.clientY;stx=tx;sty=ty;stage.setPointerCapture(e.pointerId)})
 stage.addEventListener('pointermove',e=>{if(!isPan)return;tx=stx+e.clientX-sx;ty=sty+e.clientY-sy;apply()})
 const end=()=>{isPan=false;stage.classList.remove('dragging')}; ['pointerup','pointercancel'].forEach(ev=>stage.addEventListener(ev,end));
 stage.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,e.deltaY<0?1.12:1/1.12)},{passive:false});
 document.getElementById('zi').onclick=()=>{const r=stage.getBoundingClientRect();zoomAt(r.left+r.width/2,r.top+r.height/2,1.25)};
 document.getElementById('zo').onclick=()=>{const r=stage.getBoundingClientRect();zoomAt(r.left+r.width/2,r.top+r.height/2,1/1.25)};
 document.getElementById('zr').onclick=fit;window.addEventListener('resize',fit);fit();
})();
